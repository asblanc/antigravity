[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[build.processing]
  skip_processing = false

[context.production.environment]
  SECRETS_SCAN_OMIT_PATHS = ".env.example,execution/seed_firestore.mjs"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
